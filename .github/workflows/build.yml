name: Build Wallpaper Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: |
          yes | sdkmanager "platforms;android-36"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Descompactar projeto
        run: |
          unzip -o WallpaperStudio-v1.1-API36.zip -d project

      - name: Compilar APK
        run: |
          cd project/WallpaperStudio-v1.1
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperStudio-APK
          path: project/WallpaperStudio-v1.1/app/build/outputs/apk/debug/app-debug.apk
